# Stage 2 — final production config.
# Canonical host: https://expertstack.co.in
#   http://expertstack.co.in      -> https://expertstack.co.in
#   http://www.expertstack.co.in  -> https://expertstack.co.in
#   https://www.expertstack.co.in -> https://expertstack.co.in
# Each hop is a single 301 with no loop: the www TLS block is separate from the
# canonical block, so a request is never redirected to itself.

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name expertstack.co.in www.expertstack.co.in;

    # Renewals must keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://expertstack.co.in$request_uri;
    }
}

# ------------------------------------------------- https://www -> https://apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.expertstack.co.in;

    ssl_certificate     /etc/letsencrypt/live/expertstack.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertstack.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://expertstack.co.in$request_uri;
}

# ------------------------------------------------------------ canonical origin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name expertstack.co.in;

    ssl_certificate     /etc/letsencrypt/live/expertstack.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertstack.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers. HSTS is deliberately conservative (no preload) until you
    # are certain every subdomain can serve HTTPS.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Do not advertise the backend.
    server_tokens off;

    # Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Block anything that should never be served, in case of a misconfiguration.
    location ~ /\.(env|git) { deny all; return 404; }
    location ~ ^/(node_modules|\.next/cache)/ { deny all; return 404; }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
