# Stage 1 — HTTP only.
# Purpose: serve the ACME challenge so Certbot can issue the certificate, and
# prove Nginx can reach the application before TLS is introduced.
# Replaced by nginx-stage2-https.conf once the certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name expertstack.co.in www.expertstack.co.in;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
